# 과제 3: 과제 2의 geth-dev에 버전 고정 + 메트릭을 더한 버전
# 이 파일은 ArgoCD가 GitHub에서 읽어서 배포한다. 직접 kubectl apply 하지 않는다.

apiVersion: v1
kind: Service
metadata:
  name: geth-dev
  labels:
    app: geth-dev
spec:
  selector:
    app: geth-dev
  ports:
    - name: http-rpc
      port: 8545
      targetPort: 8545
    - name: metrics              # Prometheus가 긁어갈 포트
      port: 6060
      targetPort: 6060
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: geth-dev
spec:
  serviceName: geth-dev
  replicas: 1
  selector:
    matchLabels:
      app: geth-dev
  template:
    metadata:
      labels:
        app: geth-dev
    spec:
      enableServiceLinks: false    # 과제 2의 GETH_DEV_* WARN 제거
      containers:
        - name: geth
          image: ethereum/client-go:v1.17.4   # 버전 고정. 4번 단계에서 PR로 올린다
          args:
            - --dev
            - --dev.period=12
            - --datadir=/data
            - --http
            - --http.addr=0.0.0.0
            - --http.vhosts=*
            - --http.api=eth,net,web3,txpool,debug
            - --metrics                  # 메트릭 수집 켜기
            - --metrics.addr=0.0.0.0     # 파드 밖(Prometheus)에서 읽을 수 있게
            - --metrics.port=6060
          ports:
            - containerPort: 8545
              name: http-rpc
            - containerPort: 6060
              name: metrics
          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: chaindata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: chaindata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
